name: Generate E.G.O Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      # =========================
      # リポジトリ取得
      # =========================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # Node.js
      # =========================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =========================
      # E.G.Oページ生成
      # =========================

      - name: Generate E.G.O pages
        run: npm run generate


      # =========================
      # 生成結果確認
      # =========================

      - name: Check generated pages
        run: |
          echo "=== Generated E.G.O pages ==="
          find ego -name index.html -print

          echo ""
          echo "=== Example generated page ==="

          if [ -f "ego/ego001/index.html" ]; then
            sed -n '1,80p' ego/ego001/index.html
          else
            echo "ego/ego001/index.html does not exist."
          fi


      # =========================
      # Gitへ反映
      # =========================

      - name: Commit generated pages
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add ego/


          if git diff --cached --quiet; then

            echo "No changes to generated pages."

          else

            git commit -m "Generate E.G.O pages"

            git push

          fi
