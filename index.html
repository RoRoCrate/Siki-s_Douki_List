<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

    <!-- =========================
     Discord / OGP (SNS共有用)
========================= -->

<meta
    property="og:type"
    content="website"
>


<meta
    property="og:title"
    content="解析E.G.Oデータ置き場"
>


<meta
    property="og:description"
    content="解析EGOの集積所"
>

<meta
    property="og:site_name"
    content="解析E.G.Oデータ置き場"
>


<meta
    name="twitter:card"
    content="summary"
>


<meta
    name="twitter:title"
    content="解析E.G.Oデータ置き場"
>


<meta
    name="twitter:description"
    content="解析EGOの集積所"
>


<title>解析E.G.Oデータ置き場</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

</head>


<body>


<header class="site-header">

    <div>

        <p class="eyebrow">
            E.G.O DATABASE
        </p>

        <h1>
            解析E.G.Oデータ置き場
        </h1>
        <p>このサイトには複数人のPCデータがあるので卓で提出する際は必要資源の下にある共有ボタンからリンクをコピーしてください<br>一覧ページを他の人に共有するのは控えてくれると助かります</p>

    </div>

</header>


<main class="container">


    <section class="search-panel">

        <input
            id="keyword"
            type="search"
            placeholder="名称・ランク・効果などを検索"
        >


        <select id="rank">

            <option value="">
                すべてのランク
            </option>

        </select>

    </section>


    <section>


        <div class="result-header">

            <h2>
                E.G.O一覧
            </h2>

            <span id="resultCount"></span>

        </div>


        <div
            id="egoList"
            class="ego-list"
        ></div>


        <p
            id="errorMessage"
            class="message error hidden"
        ></p>


    </section>


</main>


<script src="js/tsv.js"></script>

<script src="js/index.js"></script>


</body>

</html>
